name: Update fuel price data

# Runs daily. Fetches Spain and Portugal fuel prices, builds daily price
# history, pulls Brent/WTI crude closes from FRED, computes a commodity
# dashboard (crude vs retail correlation), and finally rebuilds the root
# manifest so the client knows whether anything changed anywhere.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Spain
        env:
          SPAIN_SOURCE_URL: ${{ secrets.SPAIN_SOURCE_URL }}
          SPAIN_PROXY_KEY: ${{ secrets.SPAIN_PROXY_KEY }}
        run: python scripts/fetch_spain.py
        
      - name: Fetch Portugal
        run: python scripts/fetch_portugal.py

      ## Build price history
      - name: Build price history
        run: python scripts/build_history.py

      - name: Fetch crude prices (FRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_crude.py

      - name: Build commodity dashboard
        run: python scripts/build_commodities.py

      - name: Build root manifest
        run: python scripts/build_manifest.py

      - name: Commit changes if any
        run: |
          git config user.name "fuel-prices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update fuel price data [skip ci]"
            git push
          fi